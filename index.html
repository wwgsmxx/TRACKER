<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HabitFlow - Habit Tracker</title>
  <script>
    (function() {
      try {
        var t = localStorage.getItem('habitflow_theme');
        var s = localStorage.getItem('habitflow_session');
        if (s) {
          var user = JSON.parse(s).username || JSON.parse(s).email;
          var db = JSON.parse(localStorage.getItem('habitflow_db') || '{}');
          if (db.users && user && db.users[user] && db.users[user].settings && db.users[user].settings.theme) {
            t = db.users[user].settings.theme;
          }
        }
        if (t === 'light') {
          document.documentElement.classList.remove('dark');
        } else {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    })();
  </script>
  <script src="./shared.js"></script>
  <script>
    const user = Auth.getCurrentUser();
    if (user) {
      window.location.replace('./dashboard.html');
    } else {
      window.location.replace('./landing.html');
    }
  </script>
</head>
<body style="background-color: var(--background); color: var(--foreground); display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; font-family: system-ui, -apple-system, sans-serif;">
  <div style="text-align: center;">
    <div style="width: 40px; height: 40px; border-radius: 10px; background-color: #10b981; display: inline-flex; align-items: center; justify-content: center; font-weight: 800; font-size: 20px; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3); margin-bottom: 12px; color: white;">H</div>
    <div style="font-weight: 600; font-size: 14px; opacity: 0.6;">Loading HabitFlow...</div>
  </div>
</body>
</html>
